:root{color-scheme:dark;--bg:#000;--card:#0e100f;--card2:#161a18;--line:#1b201d;--tx:#f2f5f3;--mut:#8b958f;--g:#34d27b;--g2:#7be3a3;--b:#5f8fc4;--p:#8f7fc0;--o:#c98a4b;--y:#d9d44a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 Inter,system-ui,sans-serif}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px));position:relative;z-index:1}
h1{font:600 28px/1.1 Inter,sans-serif;margin:6px 0 16px;letter-spacing:-.3px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.07);border-top-color:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);border-radius:20px;padding:16px;margin-bottom:10px}
#app{overflow:hidden}#glow{position:absolute;top:-170px;left:50%;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:radial-gradient(circle,#34d27b 0%,rgba(52,210,123,0) 66%);opacity:.2;transition:opacity .9s;pointer-events:none;z-index:0}
.mut{color:var(--mut)}.g{color:var(--g)}
.big{font:600 34px/1 Inter,sans-serif;letter-spacing:-.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--g);transition:width .4s}
nav{position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:6px;border-radius:28px;background:rgba(22,26,24,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);border-top-color:rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:500 10px Inter;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:22px;transition:background .2s,color .2s}
nav button.on{color:var(--g);background:rgba(52,210,123,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;min-width:max-content;background:none;border:0;color:var(--mut);font:500 14px Inter;padding:9px 14px;border-radius:20px}
.tabs button.on{background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);color:var(--tx);font-weight:600}
.task{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.task:first-child{border-top:0}.task .ic{font-size:22px;width:28px;text-align:center}.task .m{flex:1;min-width:0}.task b{font-weight:600}
.task .bar{margin-top:6px}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:14px;color:#04140b}
.chk.on{background:linear-gradient(145deg,#6ff0a8,#25b866);border-color:rgba(255,255,255,.5);box-shadow:0 0 10px rgba(52,210,123,.35)}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.grid2 .card{margin:0;padding:11px}.grid2 small{color:var(--mut);font-size:12px}.grid2 div.v{font:600 20px Inter;margin-top:4px}
.btn{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--tx);border-radius:16px;padding:14px;font:600 15px Inter;display:flex;justify-content:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;flex:1}.cal i{aspect-ratio:1;border-radius:3px;border:1px solid rgba(255,255,255,.08)}
.cal i.t{outline:2px solid #fff}
.s3{background:#34d27b!important}.s2{background:#a8d65a!important}.s1{background:#e0963f!important}.s0{background:#3b423e!important}.s3,.s2,.s1,.s0{border-color:transparent!important}
.mon{display:flex;gap:14px;margin-bottom:14px;align-items:center}.mon div:first-child{width:92px;font-weight:600}.mon small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.leg{display:flex;gap:14px;font-size:11px;color:var(--mut);justify-content:center;margin-top:4px}.leg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
svg text{fill:#8b958f;font:10px Inter}
.ph{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(160deg,#242b27,#141816);display:grid;place-items:center;color:var(--mut);font-size:12px;position:relative;overflow:hidden;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px;background:linear-gradient(transparent,#000c);font:600 14px Inter;color:#fff}
.ph span small{display:block;font:600 16px Inter}
.cp{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.cp:first-child{border:0}.cp .l{flex:1;color:var(--mut)}.cp .d{color:var(--g);font-weight:600}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}.sheet>div{width:100%;max-width:480px;background:rgba(18,22,20,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.1);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:600 22px Inter;padding:12px;margin:12px 0}
.sheet .btn{background:var(--g);color:#04140b;border:0}

async function syncNotif(){const n=LN();if(!n)return;try{const ids=[{id:1}];for(let i=101;i<=106;i++)ids.push({id:i});await n.cancel({notifications:ids});const c=S.cfg,list=[];
 if(c.nEve){const[h,m]=(c.nEveT||'21:00').split(':').map(Number);list.push({id:1,title:'lock180',body:'Внеси данные за сегодня: питание, шаги, работа.',schedule:{on:{hour:h,minute:m},allowWhileIdle:true}})}
 if(c.nCp){const[y,mo,d0]=c.startDate.split('-').map(Number),P=S.cps||{};[30,60,90,120,150,180].forEach((d,i)=>{const at=new Date(y,mo-1,d0+d-1,10,0);if(at>new Date()&&!P[d])list.push({id:101+i,title:'Чекпоинт дня '+d+' готов',body:'Внеси вес, замеры и фото.',schedule:{at,allowWhileIdle:true}})})}
 if(list.length)await n.schedule({notifications:list})}catch(e){}}
const MS={7:['Первая неделя позади','Самое сложное в любом начинании — первые дни. Ты их прошёл.'],30:['30 дней — шестая часть пути','Пора заполнить первый чекпоинт и посмотреть, что изменилось.'],60:['Треть пути','Привычки уже закрепились. Дальше проще, чем начало.'],90:['Половина пути','90 дней позади. Осталось столько же.'],100:['100 дней','Трёхзначное число. Это уже не эксперимент, а образ жизни.'],150:['Осталось 30 дней','Финишная прямая. Не сбавляй темп.'],180:['Финиш','180 дней пройдено. Заполни последний чекпоинт и сравни с началом.']};
function checkMs(){if(S.tab!='today'||!$('#ms'))return;S.ms=S.ms||{};const m=Object.keys(MS).map(Number).filter(x=>x<=S.day&&!S.ms[x]).pop();if(!m||$('#ms').classList.contains('on'))return;const ok=S.days.slice(0,m).filter(x=>x>=2).length;$('#msT').textContent=MS[m][0];$('#msP').textContent=MS[m][1]+(m>=30?' Успешных дней: '+ok+' из '+m+'.':'');$('#ms').dataset.m=m;$('#ms').classList.add('on')}
function whyCard(){const w=S.cfg.why;if(!w)return '';const pd=S.days[S.day-2],bad=S.day>1&&pd!=null&&pd<=1,late=new Date().getHours()>=18&&pct()<30;return bad||late?`<div class="card"><small class="mut">Зачем ты начал</small><div style="margin-top:6px;white-space:pre-wrap;font-size:16px">${esc(w)}</div></div>`:''}
const st=p=>p>=85?3:p>=60?2:p>=30?1:0;
function syncDay(){const td=iso(Date.now()),c=S.cfg;if(!c.startDate)c.startDate=td;S.day=Math.min(180,Math.max(1,Math.round((Date.parse(td)-Date.parse(c.startDate))/864e5)+1));if(S.tDate&&S.tDate!==td){const pd=S.tDay||S.day;S.days[pd-1]=st(pct());for(let d=pd+1;d<S.day;d++)if(S.days[d-1]==null)S.days[d-1]=0;S.t={food:0,ex:false,work:0,steps:0,sleep:false};save()}S.tDate=td;S.tDay=S.day}
function render(){syncDay();const k=S.tab;setTimeout(checkMs,0);const gl=$('#glow');if(gl)gl.style.opacity=(.08+pct()/100*.26).toFixed(2);$('#v').innerHTML=V[k]();
 $('#nav').innerHTML=NAV.map(n=>`<button data-t="${n[0]}" class="${k==n[0]?'on':''}"><svg viewBox="0 0 24 24">${ic[n[0]]}</svg>${n[1]}</button>`).join('')}

$('#slOk').onclick=()=>{const b=$('#slB').value,w=$('#slW').value;if(!b||!w)return;const h=Math.round(slDur(b,w)*100)/100;S.t.sleepH=h;S.sleepLog=S.sleepLog||{};S.sleepLog[S.day]=h;S.sleepT=S.sleepT||{};S.sleepT[S.day]={b,w};S.sleep=Array.from({length:28},(_,i)=>S.sleepLog[S.day-27+i]||0);$('#sl').classList.remove('on');save();render();buzz(10)};

$('#cfOk').onclick=()=>{try{localStorage.removeItem(KEY)}catch(x){}const c=S.cfg,cu=S.custom,z=n=>Array(n).fill(0);S=JSON.parse(JSON.stringify(DEF));c.startDate=iso(Date.now());S.cfg=c;S.custom=cu;S.day=1;S.tab='today';S.w=[[1,c.start]];S.inc=z(6);S.orders=S.clients=S.own=0;S.hrs=z(6);S.sleep=z(28);S.t={food:0,ex:false,work:0,steps:0,sleep:false};S.days=[];S.img={};$('#cf').classList.remove('on');save();render()};
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let el;
 if(el=q('[data-t]')){S.tab=el.dataset.t;render();$('#v').scrollTop=0}
 else if(el=q('[data-pt]')){S.pt=el.dataset.pt;render()}
 else if(el=q('[data-cp]')){S.cp=+el.dataset.cp;render()}
 else if(el=q('[data-k]')){const k=el.dataset.k;
  if(k=='food')ask('Съедено сегодня, ккал',S.t.food,v=>S.t.food=v);
  else if(k=='work')ask('Отработано сегодня, ч',S.t.work,v=>S.t.work=v);else if(k=='steps')ask('Шагов сегодня',S.t.steps||0,v=>S.t.steps=Math.round(v));else if(k=='sleep')openSleep();
  else{const cu=(S.custom||[]).find(x=>x.id==k);if(cu&&cu.type=='num')ask(cu.n+', '+cu.u,S.t[k]||0,v=>S.t[k]=v);else{S.t[k]=!S.t[k];window.__ck=k;save();render();window.__ck=null;if(S.t[k])buzz(15)}}}
 else if(el=q('[data-add]')){const a=el.dataset.add;
  if(a=='w')ask('Текущий вес, кг',cur(),v=>{S.w=S.w.filter(p=>p[0]!=S.day);S.w.push([S.day,v]);S.w.sort((x,y)=>x[0]-y[0])});
  if(a=='inc')ask('Доход от заказов, $','',v=>{S.orders+=v;S.inc[Math.min(5,Math.floor((S.day-1)/30))]+=v});
  if(a=='hrs')ask('Часы работы, ч','',v=>S.hrs[Math.min(5,Math.floor((S.day-1)/30))]+=v)}
 else if(q('[data-ntog]')){const k=q('[data-ntog]').dataset.ntog;S.cfg[k]=S.cfg[k]?0:1;save();render();(async()=>{if(S.cfg[k])await askNotif();await syncNotif()})()}else if(q('[data-gocp]')){S.cp=+q('[data-gocp]').dataset.gocp;S.tab='chk';render();$('#v').scrollTop=0}else if(q('[data-savecp]')){const g=id=>{const v=parseFloat($('#'+id).value.replace(',','.'));return isNaN(v)?undefined:v},P=S.cps=S.cps||{},w=g('cpW');P[S.cp]={w,waist:g('cpWa'),chest:g('cpCh'),hips:g('cpHi'),note:$('#cpNote').value.trim(),day:S.day};if(w!=null){if(S.cp==1){S.cfg.start=w;S.w[0][1]=w}else{S.w=S.w.filter(p=>p[0]!=S.day);S.w.push([S.day,w]);S.w.sort((x,y)=>x[0]-y[0])}}S.cpEdit=null;save();render();syncNotif()}else if(q('[data-editcp]')){S.cpEdit=S.cp;render()}else if(q('[data-addc]')){['ctN','ctV','ctU'].forEach(i=>$('#'+i).value='');$('#ctI').value='star';$('#ctT').value='chk';$('#ctG').style.display='none';$('#ct').classList.add('on')}else if(q('[data-delc]')){const id=q('[data-delc]').dataset.delc;S.custom=S.custom.filter(x=>x.id!=id);save();render()}else if(q('[data-reset]'))$('#cf').classList.add('on');else if(q('[data-tog]')){const k=q('[data-tog]').dataset.tog;S.cfg.on[k]=!S.cfg.on[k];save();render()}else if(q('[data-next]')){const p=pct();S.days[S.day-1]=p>=85?3:p>=60?2:p>=30?1:0;if(S.day<180)S.day++;S.t={food:0,ex:false,work:0,steps:0,sleep:false};save();render();$('#v').scrollTop=0}
 else if(q('[data-toast]'))(S.tab='set',render())});
document.addEventListener('change',e=>{const kk=e.target.dataset.cfg;if(kk=='why'){S.cfg.why=e.target.value.trim();save();return}if(kk=='startDate'||kk=='nEveT'){if(e.target.value){S.cfg[kk]=e.target.value;save();syncNotif();render()}return}if(kk){const v=parseFloat(e.target.value);if(!isNaN(v)){if(kk=='day')S.day=Math.min(180,Math.max(1,Math.round(v)));else{S.cfg[kk]=v;if(kk=='start')S.w[0][1]=v}save()}return}const f=e.target.dataset.f;if(f&&e.target.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=600,z=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=S.img||{};S.img[f]=c.toDataURL('image/jpeg',.8);save();render()};im.onerror=()=>{S.img=S.img||{};S.img[f]=r.result;render()};im.src=r.result};r.readAsDataURL(e.target.files[0])}});
